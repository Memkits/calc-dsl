
name: npm publish

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-production
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
        package-manager-cache: false

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit entries
      run: |
        set -euo pipefail
        test "$(calcit --version)" = "0.27.0"
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --keep-going
        calcit calcit.cirru --entry cli --check-only --keep-going
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru analyze dynamic-methods
        calcit calcit.cirru --entry cli analyze dynamic-methods
        calcit calcit.cirru analyze deprecated --summary-only

    - name: Build web assets with CDN URLs
      env:
        VITE_BASE_URL: https://cos-sh.tiye.me/${{ github.repository }}/
      run: |
        set -euo pipefail
        yarn build

    - name: Upload and verify static assets on COS
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ github.repository }}/
        public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      id: deploy
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Build CLI assets
      run: |
        yarn compile-cli
        yarn test:cli

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
